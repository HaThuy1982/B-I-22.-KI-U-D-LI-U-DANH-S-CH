<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đoàn Tàu Bí Ẩn - Khám Phá Python List</title>
    <!-- Liên kết file CSS (nếu bạn đặt trong src) -->
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <header class="app-header">
        <h1>🚂 Trò Chơi: Đoàn Tàu Bí Ẩn</h1>
        <p>Khám phá cách đánh chỉ số (Index) của Danh sách (List) trong Python</p>
    </header>

    <main class="game-container">
        <!-- Khu vực hiển thị mảng/danh sách -->
        <section class="train-track">
            <div id="train-container" class="train">
                <!-- Các toa tàu (phần tử của list) sẽ được tạo tự động bằng JavaScript -->
            </div>
        </section>

        <!-- Khu vực tương tác cho học sinh -->
        <section class="interaction-panel">
            <h2>Nhiệm vụ của bạn</h2>
            <div class="control-group">
                <label for="index-input">Gọi toa tàu số:</label>
                <input type="number" id="index-input" min="0" max="4" placeholder="Nhập số...">
                <button id="check-btn" class="btn">Giơ tay!</button>
            </div>
            <div id="feedback-message" class="message hidden">
                <!-- Thông báo kết quả sẽ hiện ở đây -->
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>Thiết kế bởi: <strong>Hà Thanh Thuỷ</strong> | <strong>THPT LƯƠNG NGỌC QUYẾN</strong></p>
    </footer>

    <!-- Liên kết file logic TypeScript/JavaScript -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
